name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check version consistency
        run: python3 scripts/version.py
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-packages --all-extras --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest -q

  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Enable pnpm
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check
        run: pnpm typecheck
      - name: Build
        run: pnpm build

  client:
    name: Go client
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: packages/client/go.mod
          cache-dependency-path: packages/client/go.sum
      - name: Test
        working-directory: packages/client
        run: go test -race ./...
      - name: Vet
        working-directory: packages/client
        run: go vet ./...
      - name: Build release archives
        run: ./scripts/package_client.sh

  containers:
    name: Containers
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build server image
        run: docker build -t modelshelf:ci .
      - name: Build NFS image
        run: docker build -t modelshelf-nfs:ci docker/nfs
      - name: Test NFSv4.1 and NFSv4.2 content reads
        env:
          MODELSHELF_NFS_TEST_IMAGE: modelshelf-nfs:ci
        run: sudo --preserve-env=MODELSHELF_NFS_TEST_IMAGE ./scripts/test_nfs_compatibility.sh
