[project]
name = "modelshelf-core"
version = "0.1.0b18"
description = "Shared filesystem catalog and manifest primitives for ModelShelf"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelshelf_core"]
