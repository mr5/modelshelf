[project]
name = "modelshelf-workspace"
version = "0.1.0b4"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/core", "packages/server"]

[tool.uv.sources]
modelshelf-core = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["modelshelf_core", "modelshelf_server"]
mypy_path = ["packages/core/src", "packages/server/src"]
